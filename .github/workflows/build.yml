name: build-aimbot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.6.0
          python -m pip show ultralytics
          python -c "import ultralytics; print('Ultralytics import OK:', ultralytics.__version__)"

      - name: Download YOLOv8n weights
        shell: pwsh
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name aimbot --add-data "yolov8n.pt;." --collect-all ultralytics --collect-all cv2 --collect-all mss --hidden-import win32api --hidden-import win32con aimbot/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-exe
          path: dist/aimbot.exe
          if-no-files-found: error
          retention-days: 7
