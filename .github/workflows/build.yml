name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.6.0

      - name: Download model weights
        run: python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name aimbot --add-data "yolov8n.pt;." --collect-all ultralytics --collect-all cv2 --collect-all mss --hidden-import win32api --hidden-import win32con aimbot/main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-exe
          path: dist/aimbot.exe
          if-no-files-found: error
          retention-days: 7
