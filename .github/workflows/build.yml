name: build-rivals-aimbot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.6.0
          python -c "import ultralytics, cv2, mss, screeninfo; print('Imports OK')"
      - name: Download YOLOv8n fallback weights
        shell: pwsh
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name rivals-aimbot --add-data "yolov8n.pt;." --collect-all ultralytics --collect-all cv2 --collect-all mss --collect-all screeninfo --hidden-import win32api --hidden-import win32con --hidden-import overlay src/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivals-aimbot-exe
          path: dist/rivals-aimbot.exe
          if-no-files-found: error
          retention-days: 7
